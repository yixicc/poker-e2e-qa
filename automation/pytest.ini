[pytest]
testpaths = api ui
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    api: MCP / HTTP API 自动化
    ui: 浏览器 UI 自动化
    P0: 高优先级
    P1: 中优先级
    smoke: 冒烟
    skip_ui_if_unconfigured: UI 未配置时自动跳过
filterwarnings =
    ignore::DeprecationWarning
